name: Android quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DLIGHT_RELEASE_API_BASE_URL: https://example.invalid/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify Debug and Release
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:lintRelease
          :app:assembleDebug
          :app:assembleRelease
          -PDLIGHT_RELEASE_API_BASE_URL="$DLIGHT_RELEASE_API_BASE_URL"
          --console=plain
      - name: Scan tracked secrets and obsolete dependencies
        run: |
          test -z "$(git ls-files '*.jks' '*.keystore')"
          ! git grep -nE "storePassword[[:space:]]+['\"]|keyPassword[[:space:]]+['\"]|com\\.squareup\\.picasso|com\\.android\\.support" -- app gradle build.gradle
