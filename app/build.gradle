apply plugin: "com.android.application"

apply from: "$rootDir/gradle/base.gradle"
apply from: "../gradle/exported.gradle"

def containsControlCharacter = { String value ->
    value != null && value.toCharArray().any { Character.isISOControl(it as char) }
}
def quoteBuildConfig = { String value ->
    '"' + value.replace('\\', '\\\\')
        .replace('"', '\\"')
        .replace('\r', '\\r')
        .replace('\n', '\\n') + '"'
}
def validateApiBaseUrl = { String rawValue, String propertyName, boolean requireHttps ->
    def allowedSchemes = requireHttps ? "https" : "http or https"
    if (rawValue == null || rawValue.trim().isEmpty()) {
        throw new GradleException("Set -P${propertyName} to an ${allowedSchemes} URL for this build")
    }
    if (containsControlCharacter(rawValue)) {
        throw new GradleException("${propertyName} must not contain control characters")
    }

    def value = rawValue.trim()
    java.net.URI uri
    try {
        uri = java.net.URI.create(value)
    } catch (IllegalArgumentException error) {
        throw new GradleException("${propertyName} is not a valid URL", error)
    }

    def scheme = uri.scheme
    def port = uri.port
    def validScheme = scheme?.equalsIgnoreCase("https")
        || (!requireHttps && scheme?.equalsIgnoreCase("http"))
    if (!validScheme
        || uri.host == null || uri.rawQuery != null || uri.rawFragment != null
        || port < -1 || port == 0 || port > 65535) {
        throw new GradleException(
            "${propertyName} must use ${allowedSchemes}, include a host and valid port, and omit query and fragment"
        )
    }
    value
}
def debugApiBaseUrl = providers.gradleProperty("DLIGHT_DEBUG_API_BASE_URL")
    .orElse("http://10.0.2.2:8000/")
    .get()
def releaseApiBaseUrl = providers.gradleProperty("DLIGHT_RELEASE_API_BASE_URL")
    .orElse("")
    .get()
def releaseSigning = [
    storeFile: System.getenv("DLIGHT_RELEASE_STORE_FILE"),
    storePassword: System.getenv("DLIGHT_RELEASE_STORE_PASSWORD"),
    keyAlias: System.getenv("DLIGHT_RELEASE_KEY_ALIAS"),
    keyPassword: System.getenv("DLIGHT_RELEASE_KEY_PASSWORD")
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.trim().isEmpty() }

android {
    defaultConfig {
        applicationId "com.dlight"
        versionCode 26
        versionName PROJ_VERSION

        multiDexEnabled true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        ndk {
            //设置支持的SO库架构
            abiFilters "arm64-v8a", "armeabi-v7a", "x86"
        }

    }

    viewBinding {
        enabled = true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            buildConfigField "String", "API_BASE_URL", quoteBuildConfig(debugApiBaseUrl)
        }
        release {
            minifyEnabled true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            buildConfigField "String", "API_BASE_URL", quoteBuildConfig(releaseApiBaseUrl)
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    lintOptions {
        abortOnError false
    }


    namespace 'com.dlight'
}

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    doFirst {
        validateApiBaseUrl(releaseApiBaseUrl, "DLIGHT_RELEASE_API_BASE_URL", true)
    }
}

tasks.matching { it.name == "preDebugBuild" }.configureEach {
    doFirst {
        validateApiBaseUrl(debugApiBaseUrl, "DLIGHT_DEBUG_API_BASE_URL", false)
    }
}

dependencies {
    implementation androidDependencies.appCompat
    implementation androidDependencies.recyclerView
    implementation androidDependencies.core
    implementation viewDependencies.danmakuFlameMaster
    implementation viewDependencies.ndkBitmap
    implementation viewDependencies.glide
    implementation androidDependencies.design
    implementation androidDependencies.viewpager2

    implementation androidDependencies.multidex

    implementation project(":gsyVideoPlayer")

    implementation dataDependencies.okhttpUtil
    implementation dataDependencies.okhttp

    implementation dataDependencies.permissionsDispatcher
    annotationProcessor dataDependencies.permissionsDispatcherProcessor

    debugImplementation dataDependencies.leakcanary

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'   // Retrofit
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'   // Gson 转换器
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'  // OkHttp 日志拦截器

    annotationProcessor 'com.github.bumptech.glide:compiler:4.14.0'

    def room_version = "2.6.1" // 最新稳定版本（2025年4月）

    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
}
